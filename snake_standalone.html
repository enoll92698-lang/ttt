<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0a0a1a;
  --surface: #12122a;
  --border:  #2a2a5a;
  --accent:  #00ff88;
  --accent2: #ff6b35;
  --accent3: #7c3aed;
  --text:    #e0e0ff;
  --text-dim:#6060a0;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(0,255,136,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(124,58,237,0.05) 0%, transparent 50%);
}

#app {
  position: relative;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}

/* ── Screens ── */
.screen {
  position: absolute;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  width: 100%; height: 100%;
  overflow-y: auto;
  padding: 12px 0;
}
.hidden { display: none !important; }

/* ── Title ── */
.title {
  font-size: clamp(2.2rem, 8vw, 4rem);
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-shadow: 0 0 30px var(--accent), 0 0 60px rgba(0,255,136,0.3);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100% { text-shadow: 0 0 30px var(--accent), 0 0 60px rgba(0,255,136,0.3); }
  50%     { text-shadow: 0 0 50px var(--accent), 0 0 100px rgba(0,255,136,0.5); }
}

/* ── Preview canvas ── */
.preview-canvas {
  border: 2px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,255,136,0.1);
  image-rendering: pixelated;
}

/* ── Selector groups ── */
.selector-group {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px;
}
.selector-label {
  font-size: 0.65rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.12em;
}

.two-col-selectors {
  display: flex; gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

/* ── Mode / Diff buttons ── */
.mode-selector, .diff-selector {
  display: flex; gap: 6px;
}
.mode-btn, .diff-btn {
  padding: 6px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.8rem; font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.mode-btn:hover, .diff-btn:hover { border-color: var(--accent); color: var(--text); }
.mode-btn.active, .diff-btn.active {
  background: rgba(0,255,136,0.1);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Skin selector ── */
.skin-selector { display: flex; gap: 8px; align-items: center; }
.skin-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.skin-btn[data-skin="neon"] { background:#00ff88; box-shadow:0 0 8px #00ff88; }
.skin-btn[data-skin="fire"] { background:#ff5500; box-shadow:0 0 8px #ff5500; }
.skin-btn[data-skin="ice"]  { background:#00e5ff; box-shadow:0 0 8px #00e5ff; }
.skin-btn[data-skin="gold"] { background:#ffd700; box-shadow:0 0 8px #ffd700; }
.skin-btn.active { border-color: #fff; transform: scale(1.25); }
.skin-btn:hover  { transform: scale(1.1); }

/* ── Info row ── */
.info-row {
  display: flex; gap: 16px; align-items: center;
  flex-wrap: wrap; justify-content: center;
}
.mode-desc    { font-size: 0.76rem; color: var(--text-dim); }
.current-best { font-size: 0.8rem; font-weight: 700; color: #ffd700; }

/* ── Stats bar ── */
.stats-bar {
  display: flex; gap: 8px;
  flex-wrap: wrap; justify-content: center;
}
.stat-chip {
  font-size: 0.76rem; color: var(--text-dim);
  padding: 3px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
}
.stat-chip strong { color: var(--text); }

/* ── Achievement badges ── */
.ach-badges {
  display: flex; gap: 5px;
  flex-wrap: wrap; justify-content: center;
  min-height: 1.8rem;
}
.ach-badge {
  font-size: 1.25rem;
  filter: grayscale(1) brightness(0.35);
  transition: filter 0.4s, transform 0.3s;
  cursor: default; user-select: none;
  title: attr(title);
}
.ach-badge.unlocked {
  filter: none;
}
.ach-badge.just-unlocked {
  animation: badge-pop 0.5s ease;
}
@keyframes badge-pop {
  0%   { transform: scale(1);   }
  40%  { transform: scale(1.5); }
  100% { transform: scale(1);   }
}

/* ── Controls hint ── */
.controls-hint {
  display: flex; gap: 16px;
  flex-wrap: wrap; justify-content: center;
  padding: 9px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.hint-item { display: flex; align-items: center; gap: 6px; font-size: 0.83rem; color: var(--text-dim); }
.key {
  display: inline-block;
  padding: 2px 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: monospace;
  font-size: 0.78rem;
  color: var(--accent);
}

/* ── Buttons ── */
.btn {
  padding: 11px 34px;
  border: none; border-radius: 10px;
  font-size: 1rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.08em;
  transition: transform 0.1s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.96); }
.btn-sm { padding: 7px 20px; font-size: 0.84rem; }
.btn-primary {
  background: var(--accent); color: #000;
  box-shadow: 0 4px 20px rgba(0,255,136,0.4);
}
.btn-primary:hover { box-shadow: 0 4px 30px rgba(0,255,136,0.7); }
.btn-secondary {
  background: transparent; color: var(--text);
  border: 2px solid var(--border);
}
.btn-secondary:hover { border-color: var(--text-dim); }

/* ── HUD ── */
#game-screen { gap: 8px; }
#hud {
  display: flex; align-items: center;
  width: min(480px, 96vw);
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; gap: 4px;
}
.hud-item { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.hud-item.center { align-items: center; }
.hud-item.right  { align-items: flex-end; }
.hud-label { font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
.hud-value { font-size: 1.25rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

.level-badge {
  padding: 3px 12px;
  background: linear-gradient(135deg, var(--accent3), #a855f7);
  border-radius: 20px; font-size: 0.74rem; font-weight: 700; color: #fff;
}
.timer-badge {
  padding: 3px 12px;
  background: linear-gradient(135deg, #dc2626, #ef4444);
  border-radius: 20px; font-size: 0.74rem; font-weight: 700; color: #fff;
  font-variant-numeric: tabular-nums;
}
.timer-badge.urgent { animation: timer-pulse 0.45s ease infinite alternate; }
@keyframes timer-pulse {
  from { background: linear-gradient(135deg,#dc2626,#ef4444); }
  to   { background: linear-gradient(135deg,#ff0000,#ff6060); box-shadow: 0 0 14px rgba(255,0,0,0.5); }
}

.mute-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 8px; padding: 3px 7px; font-size: 0.9rem;
  cursor: pointer; color: var(--text); flex-shrink: 0;
  transition: background 0.1s;
}
.mute-btn:hover { background: var(--surface); }

/* ── Canvas wrapper ── */
#canvas-wrapper {
  position: relative;
  border: 2px solid var(--border);
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 40px rgba(0,255,136,0.1);
}
#game-canvas { display: block; }
#canvas-wrapper.death::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(255,40,40,0.45);
  animation: death-flash 0.55s ease-out forwards;
  pointer-events: none;
}
@keyframes death-flash { 0% { opacity:1; } 100% { opacity:0; } }

/* ── Pause overlay ── */
#pause-overlay {
  position: absolute; inset: 0;
  background: rgba(10,10,26,0.85);
  backdrop-filter: blur(4px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
}
.pause-text { font-size: 2.2rem; font-weight: 900; color: var(--accent); letter-spacing: 0.15em; }
#pause-overlay p { color: var(--text-dim); font-size: 0.84rem; }

/* ── Effect bar ── */
#effect-bar { display: flex; gap: 6px; min-height: 22px; }
.effect-tag {
  padding: 2px 10px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 700;
  background: var(--surface); border: 1px solid #00bfff; color: #00bfff;
  animation: tag-in 0.2s ease;
}
.combo-tag  { color:#ff9500; border-color:#ff9500; background:rgba(255,149,0,0.08); }
.shield-tag { color:#00ffcc; border-color:#00ffcc; background:rgba(0,255,204,0.08); }
.boost-tag  { color:#aaff00; border-color:#aaff00; background:rgba(170,255,0,0.08); }
@keyframes tag-in { from{transform:scale(0.8);opacity:0;} to{transform:scale(1);opacity:1;} }

/* ── Food legend ── */
#food-legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.6rem; color: var(--text-dim); }
.legend-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Game over ── */
.gameover-content {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 26px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: min(400px, 92vw);
  box-shadow: 0 0 60px rgba(255,107,53,0.12);
  max-height: 92vh; overflow-y: auto;
}
.gameover-title {
  font-size: 2.1rem; font-weight: 900; color: var(--accent2);
  letter-spacing: 0.15em;
  text-shadow: 0 0 30px rgba(255,107,53,0.5);
}
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.result-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 9px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px;
}
.result-label { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
.result-value { font-size: 1.6rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

.new-record {
  font-size: 0.95rem; font-weight: 700; color: gold;
  text-shadow: 0 0 20px rgba(255,215,0,0.7);
  animation: bounce 0.55s ease infinite alternate;
}
@keyframes bounce { from{transform:scale(1);} to{transform:scale(1.1);} }

/* ── Leaderboard ── */
.leaderboard {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 13px;
}
.lb-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.lb-title { font-size: 0.68rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
.lb-mode-label { font-size: 0.62rem; color: var(--accent3); }
.lb-list { display: flex; flex-direction: column; gap: 4px; }
.lb-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 8px; background: var(--surface);
  border-radius: 6px; font-size: 0.82rem;
}
.lb-item .lb-rank { font-size: 0.95rem; }
.lb-item .lb-pts  { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.lb-item.lb-new   { border: 1px solid #ffd700; }
.lb-empty { font-size: 0.76rem; color: var(--text-dim); text-align: center; padding: 5px 0; }

/* ── World ranking ── */
.wr-you  { border: 1px solid #ffd700 !important; background: rgba(255,215,0,0.07) !important; }
.wr-name { flex: 1; font-size: 0.8rem; color: var(--text); padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lb-dots { text-align: center; color: var(--text-dim); font-size: 0.78rem; padding: 3px 0; letter-spacing: 0.2em; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 500;
  backdrop-filter: blur(4px);
}
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  width: min(380px, 90vw);
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.modal-title  { font-size: 1rem; font-weight: 700; color: var(--text); }
.modal-close  {
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px;
  font-size: 0.85rem; color: var(--text-dim); cursor: pointer;
  transition: background 0.1s;
}
.modal-close:hover { background: var(--border); color: var(--text); }

.gameover-buttons { display: flex; gap: 10px; width: 100%; }
.gameover-buttons .btn { flex: 1; padding: 10px; }
.restart-hint { font-size: 0.7rem; color: var(--text-dim); }

/* ── Achievement toast ── */
#toast-container {
  position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column-reverse; gap: 8px;
  z-index: 999; pointer-events: none;
}
.achievement-toast {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(12,12,30,0.97);
  border: 1px solid #ffd700;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(255,215,0,0.25);
  transform: translateX(130%);
  transition: transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
  min-width: 210px;
}
.achievement-toast.show { transform: translateX(0); }
.ach-toast-icon { font-size: 1.7rem; flex-shrink: 0; }
.ach-toast-label { font-size: 0.58rem; color: #ffd700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
.ach-toast-name { font-size: 0.84rem; font-weight: 700; color: var(--text); }
.ach-toast-desc { font-size: 0.7rem; color: var(--text-dim); }

/* ── Animated background orbs ── */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.15;
  pointer-events: none;
  z-index: -1;
  animation: orb-float 14s ease-in-out infinite;
}
.bg-orb-1 {
  width: 320px; height: 320px;
  background: radial-gradient(circle, #00ff88 0%, transparent 70%);
  top: 8%; left: 4%;
  animation-duration: 16s;
}
.bg-orb-2 {
  width: 260px; height: 260px;
  background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
  top: 55%; right: 6%;
  animation-duration: 20s;
  animation-delay: -6s;
}
.bg-orb-3 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, #ff6b35 0%, transparent 70%);
  bottom: 12%; left: 28%;
  animation-duration: 24s;
  animation-delay: -12s;
}
@keyframes orb-float {
  0%,100% { transform: translate(0, 0)   scale(1);    }
  33%     { transform: translate(35px,-45px) scale(1.12); }
  66%     { transform: translate(-25px,22px) scale(0.94); }
}

/* ── Mobile touch controls ── */
#touch-controls {
  display: none;
  grid-template-columns: repeat(3, 52px);
  grid-template-rows: repeat(2, 52px);
  gap: 5px; justify-content: center;
}
@media (pointer: coarse) { #touch-controls { display: grid; } }
.touch-btn {
  width: 52px; height: 52px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; font-size: 1.3rem; color: var(--text);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
  transition: background 0.1s;
}
.touch-btn:active      { background: var(--border); }
.touch-btn.center-top  { grid-column: 2; grid-row: 1; }
.touch-btn.center-left { grid-column: 1; grid-row: 2; }
.touch-btn.center-mid  { grid-column: 2; grid-row: 2; }
.touch-btn.center-right{ grid-column: 3; grid-row: 2; }

</style>
</head>
<body>
  <div id="app">

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <h1 class="title">🐍 SNAKE</h1>
      <canvas id="preview-canvas" class="preview-canvas"></canvas>

      <div class="selector-group">
        <div class="selector-label">モード</div>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="classic">クラシック</button>
          <button class="mode-btn" data-mode="nowalls">ノーウォール</button>
          <button class="mode-btn" data-mode="timeattack">タイムアタック</button>
        </div>
      </div>

      <div class="two-col-selectors">
        <div class="selector-group">
          <div class="selector-label">難易度</div>
          <div class="diff-selector">
            <button class="diff-btn" data-diff="easy">かんたん</button>
            <button class="diff-btn active" data-diff="normal">ふつう</button>
            <button class="diff-btn" data-diff="hard">むずかしい</button>
          </div>
        </div>
        <div class="selector-group">
          <div class="selector-label">スキン</div>
          <div class="skin-selector">
            <button class="skin-btn active" data-skin="neon"  title="ネオン"></button>
            <button class="skin-btn"        data-skin="fire"  title="ファイア"></button>
            <button class="skin-btn"        data-skin="ice"   title="アイス"></button>
            <button class="skin-btn"        data-skin="gold"  title="ゴールド"></button>
          </div>
        </div>
      </div>

      <div class="info-row">
        <p id="mode-desc" class="mode-desc">壁に当たるとゲームオーバー</p>
        <p id="current-best" class="current-best">ベスト: ---</p>
      </div>

      <div class="stats-bar">
        <div class="stat-chip">🎮 <strong id="stat-games">0</strong></div>
        <div class="stat-chip">🔥 ×<strong id="stat-combo">0</strong></div>
        <div class="stat-chip">📏 <strong id="stat-length">0</strong></div>
      </div>

      <div id="ach-badges" class="ach-badges"></div>

      <div class="controls-hint">
        <div class="hint-item"><span class="key">↑↓←→</span> 移動</div>
        <div class="hint-item"><span class="key">WASD</span> 移動</div>
        <div class="hint-item"><span class="key">Space</span> 一時停止</div>
      </div>
      <button id="world-ranking-btn" class="btn btn-secondary btn-sm">🌍 世界ランキング</button>
      <button id="start-btn" class="btn btn-primary">ゲームスタート</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
      <div id="hud">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-item center">
          <span id="level-badge" class="level-badge">Lv.1</span>
          <span id="timer-badge" class="timer-badge hidden">⏱ 60</span>
        </div>
        <div class="hud-item right">
          <span class="hud-label">ハイスコア</span>
          <span id="high-score" class="hud-value">0</span>
        </div>
        <button id="mute-btn" class="mute-btn" title="ミュート">🔊</button>
      </div>
      <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="pause-overlay" class="hidden">
          <div class="pause-text">⏸ PAUSED</div>
          <p>Spaceキーで再開</p>
          <button id="quit-btn" class="btn btn-secondary btn-sm">メニューへ戻る</button>
        </div>
      </div>
      <div id="effect-bar">
        <div id="effect-slow"   class="effect-tag hidden">❄️ スロー中</div>
        <div id="effect-shield" class="effect-tag shield-tag hidden">🛡 シールド</div>
        <div id="effect-combo"  class="effect-tag combo-tag hidden">🔥 コンボ ×<span id="combo-count">2</span></div>
        <div id="effect-boost" class="effect-tag boost-tag hidden">⚡ ブースト中</div>
      </div>
      <div id="food-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#ff6b35"></span>通常</div>
        <div class="legend-item"><span class="legend-dot" style="background:#ffd700"></span>ゴールド</div>
        <div class="legend-item"><span class="legend-dot" style="background:#00bfff"></span>スロー</div>
        <div class="legend-item"><span class="legend-dot" style="background:#c084fc"></span>シュリンク</div>
        <div class="legend-item"><span class="legend-dot" style="background:#00ffcc"></span>シールド</div>
        <div class="legend-item"><span class="legend-dot" style="background:#aaff00"></span>ブースト</div>
      </div>
    </div>

function playTone(freq, type, dur, vol=0.15, delay=0) {
  if (muted) return;
  try {
    const ac=getAudio(), osc=ac.createOscillator(), g=ac.createGain();
    osc.connect(g); g.connect(ac.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq, ac.currentTime+delay);
    g.gain.setValueAtTime(vol, ac.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+delay+dur);
    osc.start(ac.currentTime+delay); osc.stop(ac.currentTime+delay+dur);
  } catch(_) {}
}

];
let bgmIdx=0, bgmTimer=null, bgmRunning=false;
function bgmStep() {
  if (!bgmRunning||muted) return;
  const [freq,dur]=BGM[bgmIdx++%BGM.length];
  if (freq>0) {
    try {
      const ac=getAudio(), osc=ac.createOscillator(), g=ac.createGain();
      osc.connect(g); g.connect(ac.destination);
      osc.type='square'; osc.frequency.value=freq;
      g.gain.setValueAtTime(0.024,ac.currentTime);

      osc.start(ac.currentTime); osc.stop(ac.currentTime+dur/1000);
    } catch(_) {}
  }
  bgmTimer=setTimeout(bgmStep,dur);
}

}

function triggerShake() {
  let count=0;
  const id=setInterval(()=>{
    const mag=Math.max(0,9-count*1.4);
    canvasWrapper.style.transform=mag>0.5
      ?`translate(${(Math.random()-0.5)*mag*2}px,${(Math.random()-0.5)*mag*2}px)`:'';
    if(++count>7){clearInterval(id);canvasWrapper.style.transform='';}
  },40);
  canvasWrapper.classList.add('death');
  setTimeout(()=>canvasWrapper.classList.remove('death'),600);
}

// ── Drawing ────────────────────────────────────────────────────────────────
function drawGrid() {
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
  ctx.strokeStyle='#11112a'; ctx.lineWidth=0.5;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,CANVAS_SIZE);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(CANVAS_SIZE,i*CELL);ctx.stroke();
  }
}
function drawCell(x,y,color,radius=3,glowColor=null){
  ctx.save();
  if(glowColor){ctx.shadowColor=glowColor;ctx.shadowBlur=14;}
  ctx.fillStyle=color;
  ctx.beginPath();ctx.roundRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2,radius);ctx.fill();
  ctx.restore();
}
function drawPortalEdges(){
  if(gameMode!=='nowalls') return;
  ctx.save();ctx.strokeStyle='rgba(0,255,136,0.18)';ctx.lineWidth=4;ctx.setLineDash([8,6]);
  ctx.strokeRect(2,2,CANVAS_SIZE-4,CANVAS_SIZE-4);ctx.restore();
}
function drawObstacles(){
  for(const ob of obstacles){
    ctx.save();ctx.shadowColor='#5a5aaa';ctx.shadowBlur=8;
    ctx.fillStyle='#3a3a6a';ctx.strokeStyle='#5a5aaa';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(ob.x*CELL+2,ob.y*CELL+2,CELL-4,CELL-4,3);
    ctx.fill();ctx.stroke();ctx.restore();
  }
}
function drawFood(){
  foodPulse=(foodPulse+0.08)%(Math.PI*2);
  const isGold=food.type==='gold';
  const elapsed=isGold?performance.now()-food.spawnedAt:0;
  const remaining=isGold?Math.max(0,GOLD_TTL-elapsed):Infinity;
  if(isGold&&remaining<2000&&Math.floor(performance.now()/200)%2===0) return;
  const ft=FOOD_TYPES[food.type], scale=1+0.12*Math.sin(foodPulse);
  const cx=food.x*CELL+CELL/2, cy=food.y*CELL+CELL/2, r=(CELL/2-2)*scale;
  ctx.save();
  ctx.shadowColor=ft.color;ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);ctx.fillStyle=ft.glow;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=ft.color;ctx.fill();
  ctx.beginPath();ctx.arc(cx-r*0.28,cy-r*0.28,r*0.3,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();
  if(ft.label){
    ctx.font=`bold ${CELL*0.44}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.fillText(ft.label,cx,cy+r+9);
  }
  if(isGold){
    ctx.shadowBlur=0;ctx.fillStyle='#333';ctx.fillRect(food.x*CELL+2,food.y*CELL-6,CELL-4,3);
    ctx.fillStyle='#ffd700';ctx.fillRect(food.x*CELL+2,food.y*CELL-6,(CELL-4)*(remaining/GOLD_TTL),3);
  }
  ctx.restore();
}
function rainbowColor(i){
  return `hsl(${(i*22+performance.now()/12)%360},100%,58%)`;
}
function drawSnake(){
  const sk=SKINS[skin];
  const now=performance.now();
  const isSlow=now<slowUntil, isBoost=now<boostUntil;
  const isRainbow=combo>=5;
  const headColor=isRainbow?rainbowColor(0):(isBoost?'#aaff00':(isSlow?'#00e5ff':sk.head));
  for(let i=snake.length-1;i>=0;i--){
    const seg=snake[i];
    if(i===0){
      if(shielded){
        ctx.save();ctx.strokeStyle='#00ffcc';ctx.shadowColor='#00ffcc';ctx.shadowBlur=18;
        ctx.lineWidth=2;ctx.globalAlpha=0.7+0.3*Math.sin(performance.now()/150);
        ctx.beginPath();ctx.arc(seg.x*CELL+CELL/2,seg.y*CELL+CELL/2,CELL/2+5,0,Math.PI*2);
        ctx.stroke();ctx.restore();
      }
      drawCell(seg.x,seg.y,headColor,6,headColor);
      const d=dir,cx=seg.x*CELL+CELL/2,cy=seg.y*CELL+CELL/2;
      let e1x,e1y,e2x,e2y;
      if(d.x===1)       {e1x=cx+4;e1y=cy-4;e2x=cx+4;e2y=cy+4;}
      else if(d.x===-1) {e1x=cx-4;e1y=cy-4;e2x=cx-4;e2y=cy+4;}
      else if(d.y===-1) {e1x=cx-4;e1y=cy-4;e2x=cx+4;e2y=cy-4;}
      else              {e1x=cx-4;e1y=cy+4;e2x=cx+4;e2y=cy+4;}
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(e1x,e1y,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e2x,e2y,2,0,Math.PI*2);ctx.fill();
    } else {
      const t=i/(snake.length-1);
      let color;
      if(isRainbow)     color=rainbowColor(i);
      else if(isBoost)  color=i<snake.length*0.4?'#88cc00':'#557700';
      else if(isSlow)   color=i<snake.length*0.4?'#0099cc':'#006699';
      else              color=i<snake.length*0.4?sk.body:sk.tail;
      ctx.globalAlpha=Math.max(0.35,1-t*0.55);
      drawCell(seg.x,seg.y,color,4,isRainbow?color:null);
      ctx.globalAlpha=1;
    }
  }
}
function drawParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=p.decay;
    if(p.life<=0) return false;
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
    return true;
  });
}
function drawFloats(){
  floats=floats.filter(f=>{
    f.y+=f.vy;f.vy*=0.96;f.life-=0.022;
    if(f.life<=0) return false;
    ctx.save();ctx.globalAlpha=f.life;ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=8;
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y);ctx.restore();
    return true;
  });
}
function drawSpeedLines(){
  if(performance.now()>=boostUntil) return;
  const head=snake[0];
  const cx=head.x*CELL+CELL/2, cy=head.y*CELL+CELL/2;
  const d=dir;
  ctx.save();ctx.strokeStyle='#aaff00';ctx.lineWidth=1.5;ctx.globalAlpha=0.55;
  for(let i=0;i<4;i++){
    const offset=(i-1.5)*4;
    const perpX=d.y*offset, perpY=-d.x*offset;
    const len=18+Math.random()*14;
    const x1=cx+perpX-d.x*CELL*0.6, y1=cy+perpY-d.y*CELL*0.6;
    const x2=x1-d.x*len, y2=y1-d.y*len;
    ctx.shadowColor='#aaff00';ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  ctx.restore();
}
function drawCountdown(){
  if(cdVal<0) return;
  cdPulse+=0.18;
  const text=cdVal===0?'GO!':String(cdVal), color=cdVal===0?'#00ff88':'#ffffff';
  ctx.save();ctx.translate(CANVAS_SIZE/2,CANVAS_SIZE/2);ctx.scale(1+0.07*Math.sin(cdPulse),1+0.07*Math.sin(cdPulse));
  ctx.shadowColor=color;ctx.shadowBlur=50;ctx.fillStyle=color;
  ctx.font="bold 96px 'Segoe UI',sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=0.92;ctx.fillText(text,0,0);ctx.restore();
}
function render(){
  drawGrid();drawPortalEdges();drawObstacles();
  drawParticles();drawFloats();drawFood();drawSpeedLines();drawSnake();drawCountdown();
}

// ── Game logic ─────────────────────────────────────────────────────────────
function isCellFree(x,y){
  if(snake&&snake.some(s=>s.x===x&&s.y===y)) return false;
  if(obstacles.some(o=>o.x===x&&o.y===y)) return false;
  if(food&&food.x===x&&food.y===y) return false;
  return true;
}
function randomEmpty(){
  let pos,tries=0;
  do{pos={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};}
  while(!isCellFree(pos.x,pos.y)&&++tries<400);
  return pos;
}
function pickFoodType(){
  const weights=[
    ['normal',50],['gold',25],
    ['slow',  level>=3?13:0],
    ['shrink',level>=5?9:0],
    ['shield',5],
    ['boost', 8],
  ];
  const total=weights.reduce((s,[,w])=>s+w,0);
  let r=Math.random()*total;
  for(const [type,w] of weights){r-=w;if(r<=0) return type;}
  return 'normal';
}
function spawnFood(){
  food={...randomEmpty(),type:pickFoodType(),spawnedAt:performance.now()};
}
function addObstacles(n){ for(let i=0;i<n;i++) obstacles.push(randomEmpty()); }

function initGame(){
  const mid=Math.floor(GRID/2);
  snake=[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir=DIRS.RIGHT; nextDir=DIRS.RIGHT;
  obstacles=[];particles=[];floats=[];
  slowUntil=0;boostUntil=0;shielded=false;combo=1;score=0;level=1;foodCount=0;paused=false;
  maxComboThisGame=1;maxLengthThisGame=3;goldEatenThisGame=0;shieldSavesThisGame=0;
  newRecordShown=false;nextMilestone=MILESTONES[0];
  clearTimeout(comboTimer);comboTimer=null;
  spawnFood();
  if(gameMode==='timeattack'){
    timeLeft=TIME_ATTACK_SECS;
    levelBadge.classList.add('hidden');timerBadge.classList.remove('hidden');
    updateTimerDisplay();
  } else {
    levelBadge.classList.remove('hidden');timerBadge.classList.add('hidden');
  }
  updateHUD();updateEffectBar();
}

function tick(){
  if(!gameRunning||paused) return;
  if(food.type==='gold'&&performance.now()-food.spawnedAt>GOLD_TTL) spawnFood();
  dir=nextDir;
  const head=snake[0];
  let nx=head.x+dir.x, ny=head.y+dir.y;
  const hitWall=nx<0||nx>=GRID||ny<0||ny>=GRID;
  if(hitWall){
    if(gameMode==='nowalls'){nx=(nx+GRID)%GRID;ny=(ny+GRID)%GRID;}
    else if(shielded){
      shielded=false;shieldSavesThisGame++;sfxShieldBreak();
      spawnParticles(head.x,head.y,'#00ffcc');spawnFloat(head.x,head.y,'🛡 SAVED!','#00ffcc');
      nx=(nx+GRID)%GRID;ny=(ny+GRID)%GRID;updateEffectBar();
    } else {endGame('collision');return;}
  }
  const hitSelf=snake.some(s=>s.x===nx&&s.y===ny);
  const hitObs =obstacles.some(o=>o.x===nx&&o.y===ny);
  if(hitSelf||hitObs){
    if(shielded){
      shielded=false;shieldSavesThisGame++;sfxShieldBreak();
      spawnParticles(nx,ny,'#00ffcc');spawnFloat(nx,ny,'🛡 SAVED!','#00ffcc');
      updateEffectBar();
    } else {endGame('collision');return;}
  }
  snake.unshift({x:nx,y:ny});
  if(snake.length>maxLengthThisGame) maxLengthThisGame=snake.length;

  if(nx===food.x&&ny===food.y){
    const ft=FOOD_TYPES[food.type];
    const pts=ft.pts*level*combo;
    score+=pts; foodCount++;
    spawnParticles(food.x,food.y,ft.color);
    spawnFloat(food.x,food.y,`+${pts}${combo>1?' ×'+combo:''}`,ft.color);
    switch(food.type){
      case 'gold':   goldEatenThisGame++; sfxGold();  break;
      case 'slow':   slowUntil=performance.now()+SLOW_DURATION; sfxSlow(); break;
      case 'shrink': for(let i=0;i<SHRINK_AMT&&snake.length>3;i++) snake.pop(); sfxShrink(); break;
      case 'shield': shielded=true; sfxShield(); break;
      case 'boost':  boostUntil=performance.now()+BOOST_DURATION; sfxBoost(); break;
      default:       sfxEat();
    }
    clearTimeout(comboTimer);
    combo++;
    if(combo>maxComboThisGame) maxComboThisGame=combo;
    comboTimer=setTimeout(()=>{combo=1;updateEffectBar();},COMBO_WINDOW);
    if(gameMode!=='timeattack'&&foodCount%FOODS_PER_LVL===0){
      const prev=level; level++;
      const d=DIFFS[difficulty];
      if(level>=d.obsAt) addObstacles(Math.min(level-d.obsAt+1,d.obsMax));
      if(level>prev){sfxLevelUp();spawnFloat(Math.floor(GRID/2),Math.floor(GRID/2),`LEVEL ${level}!`,'#a855f7');}
    }
    if(score>highScore) highScore=score;
    checkMilestone(score);
    if(score>initialHighScore&&!newRecordShown){
      newRecordShown=true;
      spawnFloat(Math.floor(GRID/2),Math.floor(GRID/2)+2,'🏆 NEW RECORD!','#ffd700');
      sfxNewRecord();
    }
    spawnFood();updateHUD();updateEffectBar();
    checkAchievements();
  } else {
    snake.pop();
  }
}

function getSpeed(){
  const d=DIFFS[difficulty];
  const base=Math.max(50,d.speed-(level-1)*d.step);
  const now=performance.now();
  if(now<slowUntil)  return base*2;
  if(now<boostUntil) return Math.max(40,Math.floor(base*0.55));
  return base;
}
function updateHUD(){
  scoreEl.textContent=score; highScoreEl.textContent=highScore; levelBadge.textContent=`Lv.${level}`;
}
function updateTimerDisplay(){
  timerBadge.textContent=`⏱ ${timeLeft}`; timerBadge.classList.toggle('urgent',timeLeft<=10);
}
function updateEffectBar(){
  const now=performance.now();
  effectSlow.classList.toggle  ('hidden',!(now<slowUntil));
  effectShield.classList.toggle('hidden',!shielded);
  effectCombo.classList.toggle ('hidden',combo<2);
  effectBoost.classList.toggle ('hidden',!(now<boostUntil));
  if(combo>=2) comboCount.textContent=combo;
}
function checkMilestone(s){
  if(nextMilestone===0) return;
  if(s>=nextMilestone){
    spawnFloat(Math.floor(GRID/2),Math.floor(GRID/2)-2,`${nextMilestone.toLocaleString()} pts!`,'#ffd700');
    sfxMilestone();
    const idx=MILESTONES.indexOf(nextMilestone);
    nextMilestone=idx+1<MILESTONES.length?MILESTONES[idx+1]:0;
  }
}
function startTimerCountdown(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!gameRunning||paused) return;
    timeLeft--; updateTimerDisplay();
    if(timeLeft<=0){clearInterval(timerId);endGame('timeout');}
  },1000);
}

// ── Game loop ──────────────────────────────────────────────────────────────
function startTickLoop(){
  function loop(ts){
    animFrame=requestAnimationFrame(loop);
    if(gameRunning&&ts-lastTick>=getSpeed()){tick();lastTick=ts;}
    updateEffectBar();render();
  }
  animFrame=requestAnimationFrame(loop);
}
function stopLoop(){ if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;} }

// ── Countdown ─────────────────────────────────────────────────────────────
function startCountdown(){
  cdVal=3;cdPulse=0;sfxCountdown();
  const steps=[2,1,0]; let si=0;
  const id=setInterval(()=>{
    cdVal=steps[si++]; if(cdVal>0) sfxCountdown();
    if(si>=steps.length){
      clearInterval(id); sfxGo();
      setTimeout(()=>{cdVal=-1;gameRunning=true;startBGM();
        if(gameMode==='timeattack') startTimerCountdown();
        lastTick=performance.now();},600);
    }
  },700);
}

// ── Screens ────────────────────────────────────────────────────────────────
function showScreen(name){
  [startScreen,gameScreen,gameoverScreen].forEach(s=>s.classList.add('hidden'));
  document.getElementById(name+'-screen').classList.remove('hidden');
}
function startGame(){
  stopPreview();
  highScore=loadHS(); highScoreEl.textContent=highScore;
  initialHighScore=highScore;
  initGame(); gameRunning=false;
  showScreen('game'); lastTick=performance.now();
  startTickLoop(); startCountdown();
}
function endGame(reason='collision'){
  gameRunning=false; stopLoop(); clearInterval(timerId); stopBGM();
  if(reason!=='timeout') triggerShake();
  reason==='timeout'?sfxTimeUp():sfxGameOver();
  if(score>highScore){highScore=score;saveHS();}
  commitStats(); addToLeaderboard(score); addScoreToWorld(score);
  render();
  finalScore.textContent=score; finalHighScore.textContent=highScore;
  finalLength.textContent=snake.length; finalLevel.textContent=level;
  gameoverTitle.textContent=reason==='timeout'?'TIME UP!':'GAME OVER';
  newRecord.classList.toggle('hidden',!(score>0&&score===highScore&&foodCount>0));
  renderLeaderboard(score);
  renderWorldRankingEntries(wrList, wrYourRank);
  setTimeout(()=>showScreen('gameover'),450);
}
function togglePause(){
  if(!gameRunning) return;
  paused=!paused; pauseOverlay.classList.toggle('hidden',!paused);
  if(paused) stopBGM(); else startBGM();
}
function quitToMenu(){
  gameRunning=false; stopLoop(); clearInterval(timerId); stopBGM();
  paused=false; pauseOverlay.classList.add('hidden');
  if(score>highScore){highScore=score;saveHS();}
  commitStats(); addScoreToWorld(score);
  showScreen('start'); updateCurrentBest(); updateStatsBar(); initPreview();
}

// ── Preview animation ──────────────────────────────────────────────────────
const PV_GRID=10, PV_CELL=13;
let pvSnake, pvDir, pvFood, pvAnim=null, pvLastT=0;
function pvReset(){
  pvSnake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}]; pvDir={x:1,y:0};
  pvFood={x:Math.floor(Math.random()*PV_GRID),y:Math.floor(Math.random()*PV_GRID)};
}
function pvStep(){
  const head=pvSnake[0];
  const opts=shuffle([pvDir,turnLeft(pvDir),turnRight(pvDir)]);
  for(const d of opts){
    const nx=(head.x+d.x+PV_GRID)%PV_GRID, ny=(head.y+d.y+PV_GRID)%PV_GRID;
    if(!pvSnake.some(s=>s.x===nx&&s.y===ny)){pvDir=d;break;}
  }
  const nx=(head.x+pvDir.x+PV_GRID)%PV_GRID, ny=(head.y+pvDir.y+PV_GRID)%PV_GRID;
  if(pvSnake.some(s=>s.x===nx&&s.y===ny)){pvReset();return;}
  pvSnake.unshift({x:nx,y:ny});
  if(nx===pvFood.x&&ny===pvFood.y){
    pvFood={x:Math.floor(Math.random()*PV_GRID),y:Math.floor(Math.random()*PV_GRID)};
    if(pvSnake.length>18) pvSnake.pop();
  } else pvSnake.pop();
}
function pvDraw(pc){
  const sk=SKINS[skin];
  pc.fillStyle='#0a0a1a'; pc.fillRect(0,0,PV_GRID*PV_CELL,PV_GRID*PV_CELL);
  pc.strokeStyle='#11112a'; pc.lineWidth=0.5;
  for(let i=0;i<=PV_GRID;i++){
    pc.beginPath();pc.moveTo(i*PV_CELL,0);pc.lineTo(i*PV_CELL,PV_GRID*PV_CELL);pc.stroke();
    pc.beginPath();pc.moveTo(0,i*PV_CELL);pc.lineTo(PV_GRID*PV_CELL,i*PV_CELL);pc.stroke();
  }
  pc.save();pc.shadowColor='#ff6b35';pc.shadowBlur=10;pc.fillStyle='#ff6b35';
  pc.beginPath();pc.arc(pvFood.x*PV_CELL+PV_CELL/2,pvFood.y*PV_CELL+PV_CELL/2,PV_CELL/2-1,0,Math.PI*2);
  pc.fill();pc.restore();
  for(let i=pvSnake.length-1;i>=0;i--){
    const s=pvSnake[i];
    const color=i===0?sk.head:(i<pvSnake.length*0.4?sk.body:sk.tail);
    pc.save();if(i===0){pc.shadowColor=sk.head;pc.shadowBlur=12;}
    pc.fillStyle=color;pc.globalAlpha=Math.max(0.4,1-(i/pvSnake.length)*0.5);
    pc.beginPath();pc.roundRect(s.x*PV_CELL+1,s.y*PV_CELL+1,PV_CELL-2,PV_CELL-2,2);pc.fill();pc.restore();
  }
}
function initPreview(){
  const pvc=document.getElementById('preview-canvas');
  pvc.width=PV_GRID*PV_CELL; pvc.height=PV_GRID*PV_CELL;
  const pc=pvc.getContext('2d'); pvReset();
  if(pvAnim) cancelAnimationFrame(pvAnim);
  function loop(ts){
    pvAnim=requestAnimationFrame(loop);
    if(ts-pvLastT>180){pvStep();pvLastT=ts;}
    pvDraw(pc);
  }
  pvAnim=requestAnimationFrame(loop);
}
function stopPreview(){ if(pvAnim){cancelAnimationFrame(pvAnim);pvAnim=null;} }

// ── Boot ───────────────────────────────────────────────────────────────────
initWorldRanking();
updateCurrentBest();
updateStatsBar();
updateAchievementBadges();
showScreen('start');
initPreview();

</script>
